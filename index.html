<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revere.com | Coming Soon</title>
<meta name="description" content="Something new is coming to Revere.com.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg2: #111b2e;
    --ink: #f3efe6;
    --muted: #9aa4b5;
    --accent: #c9a96e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 10%, var(--bg2) 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 16px;
    position: relative;
    z-index: 1;
  }
  .mark {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
    font-size: clamp(3.2rem, 12vw, 7.5rem);
    letter-spacing: 0.18em;
    margin-right: -0.18em; /* optically center tracked text */
    line-height: 1;
    opacity: 0;
    animation: rise 1.6s ease-out 0.2s forwards;
  }
  .rule {
    width: 0;
    height: 1px;
    background: var(--accent);
    margin: 32px auto;
    animation: draw 1.4s ease-out 1s forwards;
  }
  .tag {
    font-size: clamp(0.8rem, 2.4vw, 0.95rem);
    letter-spacing: 0.42em;
    margin-right: -0.42em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: fade 1.4s ease-out 1.6s forwards;
  }
  footer {
    text-align: center;
    padding: 24px 16px 32px;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: #5d6779;
    position: relative;
    z-index: 1;
  }
  .glow {
    position: fixed;
    left: 50%;
    bottom: -40vh;
    width: 140vw;
    height: 70vh;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(201,169,110,0.10), transparent);
    animation: breathe 9s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes draw { to { width: 72px; } }
  @keyframes breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .mark, .tag { animation: none; opacity: 1; }
    .rule { animation: none; width: 72px; }
    .glow { animation: none; }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <h1 class="mark">REVERE</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tag">Coming Soon</p>
  </main>
  <footer>&copy; <span id="y">2026</span> Revere.com</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
